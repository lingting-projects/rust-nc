[package]
name = "bin-gpui"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "lingting network control gpui"

[[bin]]
name = "lingting-nc"
path = "src/main.rs"

[dependencies]
gpui-kit = { workspace = true, features = ["gpui-fast"] }
lingting-gpui-kit = { workspace = true }

anyhow = { workspace = true }
lib-biz = { workspace = true }
lib-converter = { workspace = true }
lib-singbox = { workspace = true }
lib-core = { workspace = true }
log = { workspace = true }
lib-db = { workspace = true }
lib-system = { workspace = true }
service-core = { workspace = true }
rust-single = { workspace = true, features = ["ipc"] }
tokio = { workspace = true }
types-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = ["winuser", "wincon"] }
# 托盘图标与右键菜单：菜单依赖 tray-icon 的 `menu` 再导出。
tray-icon = { workspace = true }
# 从 GPUI 窗口取 HWND，用于 ShowWindow 真正隐藏/恢复窗口。
raw-window-handle = "0.6"

# 把 assets/icons/256x256.ico 写入 exe 资源区，供窗口/任务栏图标使用。
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true
