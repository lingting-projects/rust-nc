name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只保留一次发布流程, 手动重复触发时取消上一次
concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 调试信息占编译产物的绝大部分体积和链接时间, CI 不需要, 关掉可让依赖缓存
  # 稳定留在仓库的 10 GB 上限内, 避免被淘汰后每次冷编译。
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    name: Build
    # GPUI 依赖一批系统库, 且 msi 依赖 WiX 6, 只发布 Windows 桌面端。
    # 编译与打包全部收敛到 scripts/package_windows.sh, workflow 只负责环境准备与调用。
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      # 与 Cargo.toml 的 rust-version 保持一致, 避免 stable 漂移导致构建结果变化
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2

      # 内核版本以 lib-singbox/go.mod 为唯一来源
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: crates/lib-singbox/go.mod
          cache-dependency-path: crates/lib-singbox/go.sum

      # 下载后把 bin 目录写入 GITHUB_PATH, 后续步骤直接可用 wix, 无需重复导出
      - name: 安装 WiX
        shell: pwsh
        run: |
          $url = "https://github.com/lingting/wix/releases/download/6.0.1/Wix.tar.gz"
          $archive = Join-Path $env:RUNNER_TEMP "Wix.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          tar zxf $archive
          $wixBin = Join-Path $env:GITHUB_WORKSPACE "Wix\bin"
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $wixBin "wix.exe") -version

      # 脚本是 bash 语法, 用 runner 自带的 Git Bash 执行
      - name: 构建与打包
        shell: bash
        run: bash scripts/package_windows.sh

      # 产物缺失或结构不对时提前失败, 避免把坏包发到 release
      - name: 校验产物
        shell: bash
        run: |
          ls -l target/lingting-nc.msi target/lingting-nc.zip

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: BUILD
          path: |
            target/lingting-nc.msi
            target/lingting-nc.zip
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      # 版本号以 Cargo.toml 为唯一来源, 同时用于 tag 与 release 名称
      - name: 设置参数
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          echo "TAG_NAME=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_NAME=$VERSION" >> $GITHUB_ENV

      - name: 下载
        uses: actions/download-artifact@v4
        with:
          name: BUILD
          path: artifacts

      - name: 发布
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: ""
          draft: false
          prerelease: false
          files: artifacts/*
